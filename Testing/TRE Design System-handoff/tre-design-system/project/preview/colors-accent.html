<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Accent</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card dark">
  <div class="eyebrow" style="margin-bottom:18px; color:#8A8A8A">Accent · used like electricity</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px;">
    <div style="border:1px solid #2C2C2C; padding:18px;">
      <div style="width:100%; height:56px; background:#E30613; margin-bottom:14px"></div>
      <div class="display" style="font-size:14px; font-weight:600">TRE Red</div>
      <div class="mono" style="font-size:11px; opacity:.6; margin-top:4px">#E30613</div>
    </div>
    <div style="border:1px solid #2C2C2C; padding:18px;">
      <div style="width:100%; height:56px; background:#B5040F; margin-bottom:14px"></div>
      <div class="display" style="font-size:14px; font-weight:600">Press</div>
      <div class="mono" style="font-size:11px; opacity:.6; margin-top:4px">#B5040F</div>
    </div>
    <div style="border:1px solid #2C2C2C; padding:18px; background:radial-gradient(circle at 50% 50%, rgba(227,6,19,0.18), transparent 70%);">
      <div style="width:100%; height:56px; background:rgba(227,6,19,0.08); margin-bottom:14px; border:1px dashed rgba(227,6,19,0.3)"></div>
      <div class="display" style="font-size:14px; font-weight:600">Glow (hero only)</div>
      <div class="mono" style="font-size:11px; opacity:.6; margin-top:4px">rgba 8%</div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8A8A8A">Reserved for: wordmark stroke, single-character accent, focus underline, 1px stat bar.</div>
</div></body></html>

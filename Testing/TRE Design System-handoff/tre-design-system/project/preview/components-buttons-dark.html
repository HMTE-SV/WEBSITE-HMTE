<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons dark</title><link rel="stylesheet" href="_base.css">
<style>
  .btn { display:inline-flex; align-items:center; gap:10px; padding:14px 22px; font-family:'Inter',sans-serif; font-size:14px; font-weight:500; border-radius:2px; border:1px solid transparent; cursor:pointer; transition:all 200ms cubic-bezier(0.2,0.8,0.2,1); line-height:1; }
  .btn-primary { background:#F0EDE8; color:#0D0D0D; }
  .btn-secondary { background:transparent; color:#F0EDE8; border-color:#F0EDE8; }
  .btn-ghost { background:transparent; color:#F0EDE8; }
  .btn .arrow { display:inline-block; width:14px; height:1px; background:currentColor; position:relative; }
  .btn .arrow::after { content:""; position:absolute; right:0; top:-3px; width:7px; height:7px; border-right:1px solid currentColor; border-top:1px solid currentColor; transform:rotate(45deg); }
</style>
</head>
<body><div class="card dark">
  <div class="eyebrow" style="margin-bottom:18px; color:#8A8A8A">Buttons · dark surface</div>
  <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap">
    <button class="btn btn-primary">Daftar program <span class="arrow"></span></button>
    <button class="btn btn-secondary">Lihat kurikulum</button>
    <button class="btn btn-ghost">Pelajari lebih <span class="arrow"></span></button>
  </div>
  <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:18px">inverted on dark · same geometry · same motion</div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="_base.css">
<style>
  @keyframes fadeUp { from {opacity:0; transform:translateY(12px);} to {opacity:1; transform:none;} }
  @keyframes hover { 0%,40% {opacity:1;} 60%,100% {opacity:0.7;} }
  .demo-fade { animation: fadeUp 400ms cubic-bezier(0.2,0.8,0.2,1) infinite alternate; }
  .demo-hover { animation: hover 1500ms ease-out infinite; }
  .demo-press { animation: pressAnim 800ms ease-in-out infinite; }
  @keyframes pressAnim { 0%,100% {transform:scale(1);} 30% {transform:scale(0.97);} }
</style>
</head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Motion · restrained · movement is information</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:18px;">
    <div style="border:1px solid #E8E4E0; padding:16px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between">
      <div class="demo-fade" style="font-family:var(--font-display); font-size:18px; font-weight:500">Section enters.</div>
      <div class="mono" style="font-size:10px; color:#8A8A8A; margin-top:14px">Fade-up · 12px · 400ms · once</div>
    </div>
    <div style="border:1px solid #E8E4E0; padding:16px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between">
      <div class="demo-hover" style="font-family:var(--font-display); font-size:18px; font-weight:500; border-bottom:1px solid #1A1A1A; padding-bottom:2px; align-self:flex-start">Hover link</div>
      <div class="mono" style="font-size:10px; color:#8A8A8A; margin-top:14px">Opacity 1 → 0.7 · 150ms</div>
    </div>
    <div style="border:1px solid #E8E4E0; padding:16px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between">
      <div class="demo-press" style="background:#1A1A1A; color:#F0EDE8; padding:10px 14px; font-size:13px; align-self:flex-start; border-radius:2px">Press</div>
      <div class="mono" style="font-size:10px; color:#8A8A8A; margin-top:14px">Scale 0.97 · 50ms · spring back</div>
    </div>
  </div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Form inputs</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Form inputs</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18px;">
    <div>
      <label style="display:block; font-size:12px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:#8A8A8A; margin-bottom:8px">Nama lengkap</label>
      <input type="text" value="Latif Ananda" style="width:100%; box-sizing:border-box; padding:12px 14px; font-family:'Inter',sans-serif; font-size:15px; border:1px solid #E8E4E0; border-radius:2px; background:#fff; color:#1A1A1A; outline:none">
    </div>
    <div>
      <label style="display:block; font-size:12px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:#8A8A8A; margin-bottom:8px">NIM</label>
      <input type="text" value="" placeholder="00/000000/SV/00000" style="width:100%; box-sizing:border-box; padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:14px; border:1px solid #1A1A1A; border-radius:2px; background:#fff; color:#1A1A1A; outline:none; box-shadow: 0 0 0 3px rgba(227,6,19,0.08)">
    </div>
  </div>
  <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:14px">default · focused (red glow ring) — labels uppercase tracked</div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Borders & dividers</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:0">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0;">
    <div style="background:#0D0D0D; color:#F0EDE8; padding:28px 32px;">
      <div class="eyebrow" style="margin-bottom:18px; color:#8A8A8A">Border · dark</div>
      <div style="border-top:1px solid #2C2C2C; padding-top:14px;">
        <div class="mono" style="font-size:12px; opacity:.7">#2C2C2C — 1px hairline</div>
      </div>
      <div style="border-top:1px solid #2C2C2C; margin-top:24px; padding-top:14px;">
        <div class="mono" style="font-size:12px; opacity:.5">Section breaks · card outlines</div>
      </div>
    </div>
    <div style="background:#F8F7F4; color:#1A1A1A; padding:28px 32px;">
      <div class="eyebrow" style="margin-bottom:18px">Border · light</div>
      <div style="border-top:1px solid #E8E4E0; padding-top:14px;">
        <div class="mono" style="font-size:12px; color:#8A8A8A">#E8E4E0 — 1px hairline</div>
      </div>
      <div style="border-top:1px solid #E8E4E0; margin-top:24px; padding-top:14px;">
        <div class="mono" style="font-size:12px; color:#B8B5B0">Same idea, warmer</div>
      </div>
    </div>
  </div>
</div></body></html>

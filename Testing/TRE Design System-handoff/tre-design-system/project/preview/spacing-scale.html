<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Spacing scale · 4px base · generous</div>
  <div style="display:flex; flex-direction:column; gap:8px;">
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">04 / 4</div><div style="height:8px; width:4px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">08 / 8</div><div style="height:8px; width:8px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">16 / 16</div><div style="height:8px; width:16px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">24 / 24</div><div style="height:8px; width:24px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">32 / 32</div><div style="height:8px; width:32px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">48 / 48</div><div style="height:8px; width:48px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">64 / 64</div><div style="height:8px; width:64px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">96 / 96</div><div style="height:8px; width:96px; background:#1A1A1A"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">120 / 120</div><div style="height:8px; width:120px; background:#E30613"></div></div>
    <div style="display:flex; align-items:center; gap:14px;"><div class="mono" style="width:60px; font-size:11px; color:#8A8A8A">160 / 160</div><div style="height:8px; width:160px; background:#E30613"></div></div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:#8A8A8A">120 and 160 are section-vertical defaults — red marks the breathing room.</div>
</div></body></html>

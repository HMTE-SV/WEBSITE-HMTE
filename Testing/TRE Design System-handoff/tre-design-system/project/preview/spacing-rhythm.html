<!doctype html>
<html><head><meta charset="utf-8"><title>Section rhythm</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card" style="padding:0">
  <div style="background:#0D0D0D; color:#F0EDE8; padding:36px 32px; position:relative;">
    <div style="position:absolute; left:8px; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; font-family:var(--font-mono); font-size:10px; color:#4A4A4A; letter-spacing:0.1em">160PX</div>
    <div class="display" style="font-size:24px; font-weight:500; letter-spacing:-0.02em">Section · dark</div>
    <div style="font-size:13px; color:#8A8A8A; margin-top:6px">120–160px vertical · 1200px max-width centered</div>
  </div>
  <div style="background:#F8F7F4; color:#1A1A1A; padding:36px 32px; position:relative;">
    <div style="position:absolute; left:8px; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; font-family:var(--font-mono); font-size:10px; color:#B8B5B0; letter-spacing:0.1em">160PX</div>
    <div class="display" style="font-size:24px; font-weight:500; letter-spacing:-0.02em">Section · light</div>
    <div style="font-size:13px; color:#8A8A8A; margin-top:6px">Alternation creates the rhythm</div>
  </div>
  <div style="background:#0D0D0D; color:#F0EDE8; padding:24px 32px;">
    <div class="mono" style="font-size:11px; color:#8A8A8A">Footer · always dark</div>
  </div>
</div></body></html>

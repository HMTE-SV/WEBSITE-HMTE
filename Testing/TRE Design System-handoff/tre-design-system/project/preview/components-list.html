<!doctype html>
<html><head><meta charset="utf-8"><title>Numbered list</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">List · numbered prefix · clear, unambiguous</div>
  <ol style="margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:0;">
    <li style="display:grid; grid-template-columns: 56px 1fr; column-gap:24px; padding:16px 0; border-bottom:1px solid #E8E4E0; align-items:center">
      <div style="font-family:var(--font-mono); font-size:22px; font-weight:600; color:#E30613; line-height:1; text-align:left">01</div>
      <div style="display:flex; flex-direction:column; justify-content:center; gap:2px">
        <div style="font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.2">Pembangkitan tenaga listrik</div>
        <div style="font-size:13px; color:#8A8A8A; line-height:1.4">Generator, turbin, sistem proteksi.</div>
      </div>
    </li>
    <li style="display:grid; grid-template-columns: 56px 1fr; column-gap:24px; padding:16px 0; border-bottom:1px solid #E8E4E0; align-items:center">
      <div style="font-family:var(--font-mono); font-size:22px; font-weight:600; color:#1A1A1A; line-height:1; text-align:left">02</div>
      <div style="display:flex; flex-direction:column; justify-content:center; gap:2px">
        <div style="font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.2">Transmisi & distribusi</div>
        <div style="font-size:13px; color:#8A8A8A; line-height:1.4">Jaringan, gardu induk, smart grid.</div>
      </div>
    </li>
    <li style="display:grid; grid-template-columns: 56px 1fr; column-gap:24px; padding:16px 0; align-items:center">
      <div style="font-family:var(--font-mono); font-size:22px; font-weight:600; color:#1A1A1A; line-height:1; text-align:left">03</div>
      <div style="display:flex; flex-direction:column; justify-content:center; gap:2px">
        <div style="font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.2">Instalasi pemanfaatan</div>
        <div style="font-size:13px; color:#8A8A8A; line-height:1.4">Industri, komersial, residensial.</div>
      </div>
    </li>
  </ol>
</div></body></html>

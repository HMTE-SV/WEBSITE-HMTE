<!doctype html>
<html><head><meta charset="utf-8"><title>Radius & elevation</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Radius · Apple-style continuous curve · consistent across surfaces</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px;">
    <div>
      <div style="height:80px; background:#1A1A1A; border-radius:8px;"></div>
      <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:8px">8 · sm</div>
      <div style="font-size:11px; color:#8A8A8A; margin-top:2px">inputs · badges</div>
    </div>
    <div>
      <div style="height:80px; background:#1A1A1A; border-radius:12px;"></div>
      <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:8px">12 · md</div>
      <div style="font-size:11px; color:#8A8A8A; margin-top:2px">buttons · chips</div>
    </div>
    <div>
      <div style="height:80px; background:#1A1A1A; border-radius:16px;"></div>
      <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:8px">16 · lg</div>
      <div style="font-size:11px; color:#8A8A8A; margin-top:2px">cards · panels</div>
    </div>
    <div>
      <div style="height:80px; background:#1A1A1A; border-radius:24px;"></div>
      <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:8px">24 · xl</div>
      <div style="font-size:11px; color:#8A8A8A; margin-top:2px">hero · sheets</div>
    </div>
    <div>
      <div style="height:80px; background:#FFFFFF; border-radius:16px; box-shadow: 0 1px 0 0 rgba(0,0,0,0.04), 0 12px 40px -12px rgba(0,0,0,0.18); border:1px solid #E8E4E0;"></div>
      <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:8px">menu</div>
      <div style="font-size:11px; color:#8A8A8A; margin-top:2px">+ shadow</div>
    </div>
  </div>
  <div style="margin-top:18px; display:flex; align-items:center; gap:14px;">
    <div style="background:#1A1A1A; color:#F0EDE8; padding:14px 22px; border-radius:12px; font-family:'Inter',sans-serif; font-size:14px; font-weight:500">Daftar program →</div>
    <div style="border:1px solid #E8E4E0; padding:18px 22px; border-radius:16px; background:#fff; font-size:13px; color:#1A1A1A">Card with 16px radius</div>
    <div style="background:#E30613; color:#fff; padding:5px 12px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.04em">UNGGUL</div>
  </div>
  <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:18px">Soft, even, deliberate. Same family of curvature whether 8px or 24px.</div>
</div></body></html>

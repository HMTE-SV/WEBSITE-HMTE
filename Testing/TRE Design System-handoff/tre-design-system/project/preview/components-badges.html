<!doctype html>
<html><head><meta charset="utf-8"><title>Badges</title><link rel="stylesheet" href="_base.css">
<style>
  .badge-hero { display:inline-flex; align-items:center; gap:10px; padding:10px 16px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; border-radius:8px; line-height:1; background:#E30613; color:#fff; box-shadow: 0 0 0 4px rgba(227,6,19,0.12); }
  .badge-hero .dot { width:7px; height:7px; background:#fff; border-radius:50%; box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
  .badge-solid { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; letter-spacing:0.04em; border-radius:8px; line-height:1; background:#1A1A1A; color:#F0EDE8; }
  .badge-tag { display:inline-flex; align-items:center; padding:6px 12px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:0.08em; border-radius:8px; line-height:1; background:#fff; color:#1A1A1A; border:1px solid #1A1A1A; }
  .badge-tag-red { background:#E30613; color:#fff; border-color:#E30613; }
</style>
</head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Badges · with emphasis · penekanan visual</div>

  <div style="margin-bottom:18px">
    <span class="badge-hero"><span class="dot"></span>AKREDITASI UNGGUL</span>
  </div>

  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px">
    <span class="badge-solid">Sarjana Terapan · D4</span>
    <span class="badge-solid" style="background:#E30613">Pendaftaran Dibuka</span>
  </div>

  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
    <span class="badge-tag badge-tag-red">PEMBANGKITAN</span>
    <span class="badge-tag">TRANSMISI</span>
    <span class="badge-tag">DISTRIBUSI</span>
    <span class="badge-tag">INSTALASI</span>
  </div>

  <div class="mono" style="font-size:11px; color:#8A8A8A; margin-top:18px">Hero · solid · tag — bolder weights, filled grounds, red glow ring on featured.</div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Logo construction (placeholder)</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Construction · spec sheet · pending final image</div>

  <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:28px; align-items:stretch;">

    <!-- Placeholder slot for final logo image with measurement annotations -->
    <div style="position:relative; height:200px; border:1px dashed #B8B5B0; background:
        repeating-linear-gradient(45deg, transparent 0 8px, rgba(0,0,0,0.025) 8px 16px);
        display:flex; align-items:center; justify-content:center;">

      <!-- corner ticks -->
      <div style="position:absolute; top:0; left:0; width:8px; height:8px; border-top:1px solid #8A8A8A; border-left:1px solid #8A8A8A;"></div>
      <div style="position:absolute; top:0; right:0; width:8px; height:8px; border-top:1px solid #8A8A8A; border-right:1px solid #8A8A8A;"></div>
      <div style="position:absolute; bottom:0; left:0; width:8px; height:8px; border-bottom:1px solid #8A8A8A; border-left:1px solid #8A8A8A;"></div>
      <div style="position:absolute; bottom:0; right:0; width:8px; height:8px; border-bottom:1px solid #8A8A8A; border-right:1px solid #8A8A8A;"></div>

      <!-- top dimension: 320px -->
      <div style="position:absolute; top:-18px; left:0; right:0; display:flex; align-items:center; gap:6px;">
        <div style="flex:1; height:1px; background:#8A8A8A;"></div>
        <span style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#8A8A8A; letter-spacing:0.08em;">320 px</span>
        <div style="flex:1; height:1px; background:#8A8A8A;"></div>
      </div>

      <!-- right dimension: 80px -->
      <div style="position:absolute; top:0; bottom:0; right:-44px; display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="flex:1; width:1px; background:#8A8A8A;"></div>
        <span style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#8A8A8A; letter-spacing:0.08em; writing-mode:vertical-rl;">80 px</span>
        <div style="flex:1; width:1px; background:#8A8A8A;"></div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#8A8A8A; text-transform:uppercase;">Logo image</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.04em; color:#1A1A1A;">tre-logo.svg · pending upload</div>
      </div>
    </div>

    <!-- Spec sheet, justified columns -->
    <div style="display:flex; flex-direction:column; justify-content:space-between; padding:6px 0;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#8A8A8A; letter-spacing:0.12em; text-transform:uppercase; padding-bottom:10px; border-bottom:1px solid #E8E4E0; margin-bottom:12px;">Specifications</div>

      <div style="display:flex; flex-direction:column; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; line-height:1;">
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Container</span><span style="color:#1A1A1A; font-weight:500">320 × 80 px</span></div>
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Cap height</span><span style="color:#1A1A1A; font-weight:500">36 px</span></div>
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Bar width</span><span style="color:#1A1A1A; font-weight:500">3 px</span></div>
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Bar–text gap</span><span style="color:#1A1A1A; font-weight:500">11 px</span></div>
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Clearspace</span><span style="color:#1A1A1A; font-weight:500">18 px (½ cap)</span></div>
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Min height</span><span style="color:#1A1A1A; font-weight:500">32 px</span></div>
        <div style="display:flex; justify-content:space-between; gap:12px;"><span style="color:#8A8A8A">Format</span><span style="color:#1A1A1A; font-weight:500">SVG · PNG @2×</span></div>
      </div>

      <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#B8B5B0; letter-spacing:0.06em; line-height:1.5; margin-top:12px; padding-top:10px; border-top:1px solid #E8E4E0;">
        Image-based logo · awaiting final upload from user
      </div>
    </div>
  </div>
</div></body></html>

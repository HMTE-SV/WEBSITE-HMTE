<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Surfaces</title><link rel="stylesheet" href="_base.css"></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom:18px">Surfaces · the two grounds</div>
  <div class="row" style="gap:0; border:1px solid var(--line)">
    <div style="flex:1; background:#0D0D0D; color:#F0EDE8; padding:24px 20px;">
      <div class="display" style="font-size:24px; font-weight:600; letter-spacing:-0.02em">Near-black</div>
      <div class="mono" style="font-size:12px; opacity:.7; margin-top:6px">#0D0D0D</div>
      <div class="mono" style="font-size:11px; opacity:.5; margin-top:18px">Hero · Footer · Dark sections</div>
    </div>
    <div style="flex:1; background:#F8F7F4; color:#1A1A1A; padding:24px 20px;">
      <div class="display" style="font-size:24px; font-weight:600; letter-spacing:-0.02em">Warm off-white</div>
      <div class="mono" style="font-size:12px; opacity:.7; margin-top:6px">#F8F7F4</div>
      <div class="mono" style="font-size:11px; opacity:.5; margin-top:18px">Content · Mid-sections</div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:13px; color:var(--fg-muted); max-width:60ch">Alternation between the two creates the rhythm. No third surface color.</div>
</div></body></html>
